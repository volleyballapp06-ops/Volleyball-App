[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/verify-session/*"
  to = "/.netlify/functions/verify-session?sessionId=:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
